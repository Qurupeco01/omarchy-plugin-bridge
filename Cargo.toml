[package]
name = "omarchy-plugin-bridge"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "opb"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
atomicwrites = "0.4.4"
clap = { version = "4.6.6", features = ["derive"] }
dialoguer = "0.11"
dirs = "6.0.0"
semver = "1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["preserve_order"] }
toml = "0.9.0"
walkdir = "2.5.0"
which = "8.0.5"

[dev-dependencies]
tempfile = "3.20.0"
