[package]
name = "omarchy-plugin-bridge"
version = "0.1.0"
edition = "2024"
description = "opb — run upstream omarchy-shell on a raw Arch + Hyprland system, component by component"
license = "MIT"
repository = "https://github.com/Qurupeco01/omarchy-plugin-bridge"
authors = ["Jose Gonzalez"]

[[bin]]
name = "opb"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
atomicwrites = "0.4.4"
clap = { version = "4.6.6", features = ["derive"] }
dialoguer = "0.11"
dirs = "6.0.0"
semver = "1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["preserve_order"] }
toml = "0.9.0"
walkdir = "2.5.0"
which = "8.0.5"

[dev-dependencies]
tempfile = "3.20.0"

# Release binaries are distributed as-is — keep them small.
[profile.release]
strip = true
lto = "thin"
